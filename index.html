$('#bar').innerHTML=[['home','🏠','หน้าแรก'],['enter','✏️','กรอกข้อมูล'],['print','🖨️','พิมพ์เอกสาร'],['set','⚙️','ตั้งค่า']].map(a=>`<button class="${g==a[0]?'on':''}" onclick="go(LASTT['${a[0]}']||GROUPS['${a[0]}'][0])"><span class="i">${a[1]}</span>${a[2]}</button>`).join('')}
function render(){nav();if(tab!='set'&&tab!='home'){const m=!S.students.length?'ยังไม่มีรายชื่อนักเรียนในชั้น '+S.cls+' — ไปที่ "ตั้งค่า" เพื่อนำเข้าหรือเพิ่มรายชื่อ':((tab=='score'||tab=='p5')&&!S.subjects.length)?'ชั้น '+S.cls+' ยังไม่มีรายวิชา — ไปที่ "ตั้งค่า" เพื่อเพิ่มรายวิชา':'';if(m){$('#app').innerHTML='<div class="card">'+m+'</div>';return}}
({home:rHome,score:rScore,att:rAtt,sum:rSum,p5:rP5,p6:rP6,asm:rAsm,book:rBook,prev:rPrev,prof:rProf,hl:rH,set:rSet})[tab]();try{window.scrollTo(0,0)}catch(e){}}
function pct(a,b){return b?Math.min(100,Math.round(a*100/b)):0}
function homeStats(){const n=S.students.length,t=S.term,now=new Date();let sc=0;
S.students.forEach(s=>S.subjects.forEach((_,j)=>{if(totT(j,s.id,t)!=null)sc++}));
const nowIso=iso(now.getFullYear(),now.getMonth()+1,now.getDate());let el=0,rec=0;
termMonths(t).forEach(([y,m])=>{for(let d=1;d<=dim(y,m);d++)if(isSchool(y,m,d)&&iso(y,m,d)<=nowIso)el++;S.students.forEach(s=>{rec+=Object.keys(((S.att[y+'-'+m]||{})[s.id])||{}).length})});
const as=S.students.filter(s=>Object.keys(S.asm[akey(s.id,t)]||{}).length).length;
const hs=S.students.filter(s=>HR.some(x=>x[0][0]==t&&hget(s.id,x[0]).w&&hget(s.id,x[0]).h)).length;
return{sc:pct(sc,n*S.subjects.length),at:pct(rec,n*el),as:pct(as,n),hs:pct(hs,n)}}
function todayInfo(){const d=new Date(),y=d.getFullYear(),m=d.getMonth()+1,dd=d.getDate(),k=y+'-'+m,ok=isSchool(y,m,dd);
return{y,m,d:dd,k,ok,n:S.students.filter(s=>((S.att[k]||{})[s.id]||{})[dd]=='1').length}}
function todayAll(){const T=todayInfo();if(!T.ok){toast('วันนี้ไม่ใช่วันเรียนตามปฏิทิน');return}
S.att[T.k]=S.att[T.k]||{};S.students.forEach(s=>{const r=S.att[T.k][s.id]=S.att[T.k][s.id]||{};if(!r[T.d])r[T.d]='1'});save();toast('บันทึกแล้ว: วันนี้มาทุกคน ✓');rHome()}
function openAtt(){const T=todayInfo();mk=T.k;tab='att';render()}
function rHome(){const n=S.students.length,T=todayInfo(),H=homeStats();const d=new Date();
const tiles=[['score','📝','กรอกคะแนน','คะแนนที่กรอกแล้ว',H.sc],['att','📅','เวลาเรียน','บันทึกเวลาเรียนแล้ว',H.at],['asm','🌟','ประเมินผู้เรียน','ประเมินแล้ว',H.as],['hl','⚖️','น้ำหนัก-ส่วนสูง','ชั่งแล้ว',H.hs],['prof','👤','ข้อมูลนักเรียน','ผู้ปกครอง ที่อยู่ สุขภาพ',null],['book','📚','พิมพ์เล่ม ปพ.5','ปก-รายวิชา-ประเมิน',null],['p6','🧾','พิมพ์ ปพ.6','รายบุคคล/ทั้งห้อง',null],['prev','🥗','ความชุก/รายงาน','โภชนาการ คะแนนรายชั้น',null]];
$('#app').innerHTML=`<div class="hero"><div class="hs">${d.getDate()} ${MN[d.getMonth()+1]} ${d.getFullYear()+543}</div><div class="hb">ชั้น${clsFull()}</div><div class="hs">${n} คน · ภาคเรียนที่ ${S.term}/${S.year}</div></div>
<div class="card"><b>📅 เช็คชื่อวันนี้</b>${T.ok?`<div class="mut" style="margin:4px 0 8px">มาแล้ว ${T.n}/${n} คน</div><div class="row"><button class="btn" onclick="todayAll()">✓ วันนี้มาทุกคน</button><button class="btn o" onclick="openAtt()">แก้เป็นรายคน</button></div>`:`<div class="mut" style="margin-top:4px">วันนี้ไม่ใช่วันเรียนตามปฏิทิน (เสาร์-อาทิตย์/วันหยุด/ปิดเทอม)</div><div class="row" style="margin-top:8px"><button class="btn o" onclick="openAtt()">ดูตารางเวลาเรียน</button></div>`}</div>
<div class="tiles">${tiles.map(t=>`<button class="tile" onclick="go('${t[0]}')"><span class="e">${t[1]}</span><b>${t[2]}</b><small>${t[3]}${t[4]!=null?' '+t[4]+'%':''}</small>${t[4]!=null?`<div class="pbar"><i style="width:${t[4]}%"></i></div>`:''}</button>`).join('')}</div>
<div class="card" style="margin-top:12px"><b>🏫 เปลี่ยนชั้น</b><div class="chips" style="margin-top:8px">${CLSORD.filter(c=>S.classes[c]).map(c=>`<button class="${c==S.cls?'on':''}" onclick="chCls('${c}')">${c} <small>(${S.classes[c].students.length})</small></button>`).join('')}</div></div>
${H.sc==0&&H.at==0?`<div class="card"><b>เริ่มต้นใช้งาน 3 ขั้น</b><ol style="margin:6px 0 0 18px;padding:0;line-height:1.8"><li>ตรวจรายชื่อ/ข้อมูลนักเรียน (หน้า "กรอกข้อมูล" → ข้อมูลนักเรียน)</li><li>กรอกคะแนน เวลาเรียน และประเมินผู้เรียน</li><li>พิมพ์เล่ม ปพ.5 / ปพ.6 ที่หน้า "พิมพ์เอกสาร"</li></ol></div>`:''}`}
/* ===== v7: ซิงค์ข้อมูลกับเซิร์ฟเวอร์ (db) · สำรองข้อมูล ===== */
let DBH=null,SYNC='local',RO=false,ERR='',lastH={},wt=null,writing=false,pending=false,staleUI=false;
const NOSYNC=['cls','term','classes','prof','asm'];
const CID=c=>({'อ':'a','ป':'p','ม':'m'}[c[0]]||'x')+c.slice(-1);
const cl=o=>JSON.parse(JSON.stringify(o));
function canon(o){return JSON.stringify(o,(k,v)=>v&&typeof v=='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v)}
function parts(){stash();const P={},meta={};for(const k in S)if(!CK.includes(k)&&!NOSYNC.includes(k))meta[k]=S[k];P['app/meta']=cl(meta);
const keep=(p,o,empty)=>{if(!empty||lastH[p])P[p]=o};
Object.entries(S.classes).forEach(([c,q])=>{const id=CID(c);P['classes/'+id]=cl({name:c,data:{students:q.students,subjects:q.subjects,health:q.health}});
keep('scores/'+id,cl({name:c,scores:q.scores||{}}),!Object.keys(q.scores||{}).length);keep('atts/'+id,cl({name:c,att:q.att||{}}),!Object.keys(q.att||{}).length)});
Object.entries(S.prof).forEach(([id,p])=>{P['profs/'+id]=cl({p})});
const A={};Object.entries(S.asm).forEach(([k,v])=>{const id=k.split('|').pop();(A[id]=A[id]||{})[k]=v});Object.entries(A).forEach(([id,a])=>{P['asms/'+id]=cl({a})});return P}
function ui(){const e=$('#syn');if(!e)return;const t={local:'💾 เก็บในเครื่องนี้เท่านั้น',nodb:'💾 เก็บในเครื่องนี้ (ยังไม่ได้เชื่อมต่อเซิร์ฟเวอร์)',sync:'☁️ กำลังบันทึก…',ok:'☁️ บันทึกบนเซิร์ฟเวอร์แล้ว',ro:'👁 ดูอย่างเดียว (ไม่มีสิทธิ์แก้ไข)',err:'⚠️ บันทึกขึ้นเซิร์ฟเวอร์ไม่สำเร็จ ('+ERR+') ข้อมูลยังอยู่ในเครื่อง'}[SYNC]||'';e.textContent=t}
function schedule(){if(!DBH||RO)return;clearTimeout(wt);wt=setTimeout(flush,900)}
async function flush(){if(!DBH||RO)return;if(writing){pending=true;return}writing=true;SYNC='sync';ui();
try{const P=parts();for(const [path,obj] of Object.entries(P)){const h=canon(obj);if(lastH[path]===h)continue;await DBH.doc(path).set(obj);lastH[path]=h}SYNC='ok';ERR=''}catch(e){SYNC='err';ERR=(e&&e.code)||'error'}
writing=false;ui();if(pending){pending=false;schedule()}}
const _save=save;save=function(){try{localStorage.setItem(KEY,ser())}catch(e){}schedule()};
function applyDoc(path,d){const[col,id]=path.split('/');lastH[path]=canon(d);d=cl(d);
if(col=='app'){Object.keys(d).forEach(k=>{if(!NOSYNC.includes(k))S[k]=d[k]})}
else if(col=='classes'){S.classes[d.name]=Object.assign(S.classes[d.name]||{},d.data)}
else if(col=='scores'){(S.classes[d.name]=S.classes[d.name]||{}).scores=d.scores}
else if(col=='atts'){(S.classes[d.name]=S.classes[d.name]||{}).att=d.att}
else if(col=='profs'){S.prof[id]=d.p}
else if(col=='asms'){Object.assign(S.asm,d.a)}}
function normCls(){Object.keys(S.classes).forEach(c=>{const n=newClass(c);CK.forEach(k=>{if(S.classes[c][k]==null)S.classes[c][k]=n[k]})});if(!S.classes[S.cls])S.cls=CLSORD.find(c=>S.classes[c])||Object.keys(S.classes)[0]||S.cls;
if(!S.classes[S.cls])S.classes[S.cls]=newClass(S.cls);const o=S.classes[S.cls];CK.forEach(k=>S[k]=o[k])}
const COLS=['classes','scores','atts','profs','asms'];
async function pullAll(){const res=await Promise.all(COLS.map(c=>DBH.collection(c).get()));const m=await DBH.doc('app/meta').get();
S.classes={};S.prof={};S.asm={};applyDoc('app/meta',m.data());res.forEach((q,i)=>q.docs.forEach(d=>applyDoc(COLS[i]+'/'+d.id,d.data())));
if(!S.info)S.info=DEF.info;if(!S.mv)S.mv={};normCls();hyd(S);normCls();si=0;pi=0;mk=null}
function subscribe(){let busy=false;const on=(ref,col)=>ref.onSnapshot(q=>{let ch=false;const list=q.docChanges?q.docChanges().filter(x=>x.type!='removed').map(x=>x.doc):[q];
list.forEach(d=>{if(!d.exists)return;const path=col=='app'?'app/meta':col+'/'+d.id,data=d.data();if(canon(data)===lastH[path])return;applyDoc(path,data);ch=true});
if(ch){normCls();try{localStorage.setItem(KEY,ser())}catch(e){}const a=document.activeElement,typing=a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName);if(typing)staleUI=true;else render()}},e=>{SYNC='err';ERR=(e&&e.code)||'error';ui()});
on(DBH.doc('app/meta'),'app');COLS.forEach(c=>on(DBH.collection(c),c))}
document.addEventListener('focusout',()=>{if(staleUI)setTimeout(()=>{const a=document.activeElement;if(!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))&&staleUI){staleUI=false;render()}},400)});
async function initSync(){try{if(!window.claude||!window.claude.use){SYNC='local';ui();return}
const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);if(!db){SYNC='nodb';ui();return}
try{if(user&&(await user.can('data.write'))===false)RO=true}catch(e){}
DBH=db;SYNC='sync';ui();const m=await DBH.doc('app/meta').get();
if(!m.exists){if(RO){SYNC='ro';ui();return}lastH={};await flush()}else{await pullAll();try{localStorage.setItem(KEY,ser())}catch(e){}}
subscribe();SYNC=RO?'ro':(SYNC=='err'?'err':'ok');ui();render()}catch(e){SYNC='err';ERR=(e&&e.code)||'error';ui()}}
function syncCard(){return`<div class="card"><b>☁️ ข้อมูลบนเซิร์ฟเวอร์</b><div class="mut" style="margin:4px 0 8px" id="syn2">${esc(({local:'เปิดจากไฟล์ที่ดาวน์โหลด: ข้อมูลเก็บในเครื่องนี้เท่านั้น',nodb:'ยังไม่ได้เชื่อมต่อเซิร์ฟเวอร์ (ต้องเข้าสู่ระบบ claude.ai และเปิดผ่านลิงก์แอป)',sync:'กำลังบันทึก…',ok:'บันทึกอัตโนมัติบนเซิร์ฟเวอร์ — เปิดจากเครื่องไหนก็เห็นข้อมูลเดียวกัน',ro:'บัญชีนี้ดูได้อย่างเดียว',err:'บันทึกไม่สำเร็จ ('+ERR+') ข้อมูลยังอยู่ในเครื่อง'})[SYNC]||'')}</div>
<div class="row"><button class="btn" onclick="flush().then(()=>{toast('ซิงค์แล้ว');rSet()})">ซิงค์ตอนนี้</button><button class="btn o" onclick="dlBackup()">ดาวน์โหลดสำรอง (.json)</button></div>
<div class="mut" style="margin-top:8px">ให้ครูท่านอื่นใช้ร่วมกัน: เมนูแชร์ของแอป → เชิญทางอีเมลเป็น "Editor" (ต้องมีบัญชี claude.ai) · ถ้าครูสองคนแก้ชั้นเดียวกันพร้อมกัน ระบบเก็บของคนที่บันทึกทีหลัง</div></div>`}
async function dlBackup(){try{const d=await claude.use('downloads');if(!d){toast('เครื่องนี้ดาวน์โหลดจากแอปไม่ได้ — ใช้ "สร้างข้อความสำรอง" ด้านล่างแทน');return}await d.save({filename:'pp5-backup-'+S.year+'.json',data:ser()})}catch(e){toast(e&&e.code=='declined'?'ยกเลิกแล้ว':'ดาวน์โหลดไม่สำเร็จ')}}
const _nav=nav;nav=function(){_nav();ui()};

if(!S.imp){importRows(ROSTER);S.imp=1;save()}
render();
initSync();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
